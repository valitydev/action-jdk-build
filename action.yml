name: 'Maven build'
description: 'Build maven project'
inputs:
  jdk-version:
    description: 'The jdk version to use'
    default: '17'
    required: false
  jdk-distribution:
    description: 'The jdk distribution to use'
    default: 'temurin'
    required: false
  jdk-base-image-tag:
    description: 'Base docker image tag'
    default: '7e0c98bb'
    required: false
  docker-registry:
    description: 'Docker registry'
    default: 'registry.hub.docker.com'
    required: false
  mvn-args:
    description: 'Additional maven arguments'
    required: false

runs:
  using: composite
  steps:
    - name: set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.jdk-version }}
        distribution: ${{ inputs.jdk-distribution }}

    - name: Cache local Maven repository
      id: mvn-cache
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - shell: bash
      run: |
        echo "REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
        echo "REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

    - shell: bash
      run: |
        mvn -B clean compile package site ${{ inputs.mvn-args }}

    - name: Check and use SBOM file
      shell: bash
      run: |
        if [[ -f "target/bom.json" ]]; then
          echo "Using existing target/bom.json"
        else
          SBOM_FILE=$(find . -path "*/target/classes/META-INF/sbom/application.cdx.json" -type f -print -quit)
      
        if [[ -n "$SBOM_FILE" ]]; then
          echo "target/bom.json not found. Using $SBOM_FILE instead."
          cp "$SBOM_FILE" target/bom.json
        else
          echo "No SBOM file found!" >&2
          exit 1
          fi
        fi

    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: bom.json
        path: 'target/bom.json'
        overwrite: true
